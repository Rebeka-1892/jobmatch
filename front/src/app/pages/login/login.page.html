<ion-content [fullscreen]="true" class="sign-in-form-page">
  <div class="container">
    <!-- Back Button -->
    <ion-button 
      fill="clear" 
      class="back-button" 
      (click)="goBack()">
      <svg width="15" height="24" viewBox="0 0 15 24" fill="none">
        <path d="M12.0692 3L3.23752 11.8317C3.10634 11.9629 3.10634 12.1756 3.23752 12.3067L12.0692 21.1385" 
              stroke="#828693" 
              stroke-width="5.37436" 
              stroke-linecap="round"/>
      </svg>
    </ion-button>

    <!-- Logo and Title Section -->
    <div class="logo-section">
      <div class="logo-container">
        <img src="assets/images/logo.png" alt="JobMatch Logo" class="logo-image">
        <h1 class="app-title">JobMatch</h1>
      </div>
    </div>

    <!-- Welcome Message -->
    <div class="welcome-section">
      <p class="welcome-text">
        Bienvenue de retour👋<br>
        Vos opportunités vous attendent.
      </p>
    </div>

    <!-- Form Section -->
    <form class="form-section" (ngSubmit)="signIn()">
      <!-- Email Input -->
      <div class="input-container">
        <ion-input
          class="custom-input"
          placeholder="VOTRE EMAIL"
          type="email"
          [(ngModel)]="email"
          name="email"
          required>
        </ion-input>
      </div>

      <!-- Password Input -->
      <div class="input-container">
        <ion-input
          class="custom-input"
          placeholder="VOTRE MOT DE PASSE"
          type="password"
          [(ngModel)]="password"
          name="password"
          required>
        </ion-input>
      </div>

      <!-- Sign In Button -->
      <ion-button 
        type="submit"
        expand="block" 
        class="signin-button"
        [disabled]="!email || !password">
        SE CONNECTER
      </ion-button>
    </form>

  </div>
</ion-content>
